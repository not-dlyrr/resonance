[package]
name = "resonance-engine"
version = "0.1.1"
edition = "2021"

[dependencies]
anyhow = "1"
serde = {version="1",features=["derive"]}
serde_json = "1"
sha2 = "0.10"
zip = {version="2",default-features=false,features=["deflate"]}
fs2 = "0.4"
walkdir = "2"
sysinfo = "0.33"
lightningcss = "1.0.0-alpha.71"
reqwest = { version = "0.13", default-features=false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = {version="0.23",default-features=false,features=["ring"]}
regex = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "resonance-cli"
path = "src/main.rs"
